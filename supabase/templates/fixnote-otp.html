<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your FixNote code</title>
  </head>
  <body style="margin:0;background:#f1f2ef;color:#202522;font-family:Inter,Segoe UI,Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f1f2ef;">
      <tr>
        <td align="center" style="padding:48px 18px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;overflow:hidden;border:1px solid #e0e2de;border-radius:24px;background:#fffefa;">
            <tr>
              <td style="padding:30px 34px 8px;">
                <table role="presentation" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="width:31px;height:31px;border-radius:9px;background:#202925;color:#fffefa;font-size:20px;font-weight:700;line-height:31px;text-align:center;">ƒ</td>
                    <td style="padding-left:10px;color:#202522;font-size:14px;font-weight:700;letter-spacing:-0.2px;">FixNote</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:30px 34px 34px;">
                <h1 style="margin:0;color:#171b18;font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1.15;">Your sign-in code</h1>
                <p style="margin:11px 0 0;color:#747c76;font-size:13px;line-height:1.55;">Enter this one-time code in FixNote to continue.</p>
                <div style="margin:28px 0;padding:18px 20px;border-radius:16px;background:#eef0ec;color:#202522;font-family:SFMono-Regular,Consolas,Liberation Mono,monospace;font-size:32px;font-weight:700;letter-spacing:9px;text-align:center;">{{ .Token }}</div>
                <p style="margin:0;color:#929994;font-size:11px;line-height:1.55;">This code expires shortly and can only be used once. If you didn’t request it, you can safely ignore this email.</p>
              </td>
            </tr>
          </table>
          <p style="margin:18px 0 0;color:#a0a6a2;font-size:10px;">A quiet place for your thoughts.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
