name: fixnote

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fixnote
      POSTGRES_USER: fixnote
      POSTGRES_PASSWORD: fixnote-local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixnote -d fixnote"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command:
      [
        "--model-id",
        "${EMBEDDINGS_MODEL:-intfloat/multilingual-e5-base}",
        "--auto-truncate"
      ]
    ports:
      - "8080:80"
    volumes:
      - embeddings-models:/data
    restart: unless-stopped

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: "${WHISPER_MODEL:-small}"
    ports:
      - "9000:9000"
    volumes:
      - whisper-models:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  embeddings-models:
  whisper-models:
